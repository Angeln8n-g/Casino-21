services:
  redis:
    image: redis:7-alpine
    container_name: casino21_redis
    restart: always
    expose:
      - "6379"
    networks:
      - default

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: casino21_backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://casino21_redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ALLOW_INSECURE_JWT_FALLBACK=${ALLOW_INSECURE_JWT_FALLBACK:-false}
      - EXPOSE_RULES_VERSION=${EXPOSE_RULES_VERSION:-false}
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - redis
    networks:
      - default
      - supabase_default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL}
        - VITE_SHOW_RULES_VERSION=${VITE_SHOW_RULES_VERSION:-false}
    container_name: casino21_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - default
      - supabase_default

networks:
  default:
  supabase_default:
    name: supabase_default
    external: true



